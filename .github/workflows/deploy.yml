name: deploy-infra

# Deploya a stack CDK no push para `main`. Autentica na AWS via OIDC (sem
# access keys de longa duração). Ver specs/phase-0-foundation (R6).

on:
  push:
    branches: [main]
    paths:
      - 'infra/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch: {} # permite rodar manualmente pela aba Actions

# Evita deploys concorrentes pisando um no outro.
concurrency:
  group: deploy-infra-main
  cancel-in-progress: false

permissions:
  id-token: write # necessário para o OIDC emitir o token
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: infra/package-lock.json

      # TEMPORÁRIO (debug 0.15): mostra os claims reais do token OIDC para
      # comparar com a condição da trust policy. Remover depois de resolver.
      - name: Debug OIDC claims
        run: |
          TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r '.value')
          PAYLOAD=$(echo "$TOKEN" | cut -d. -f2)
          python3 - "$PAYLOAD" <<'PY'
          import sys, base64, json
          s = sys.argv[1]; s += "=" * (-len(s) % 4)
          c = json.loads(base64.urlsafe_b64decode(s))
          for key in ("iss", "aud", "sub", "repository", "repository_owner", "ref", "event_name"):
              print(f"{key} = {c.get(key)!r}")
          PY

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::106537046215:role/github-actions-deploy-aws-agents-rag
          aws-region: us-east-1

      - name: Install dependencies
        run: npm ci

      - name: CDK deploy
        run: npx cdk deploy --require-approval never
