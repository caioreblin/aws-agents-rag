[project]
name = "agent"
version = "0.1.0"
description = "Núcleo do agente (Strands + MCP) — Fase 1"
requires-python = ">=3.12"
dependencies = [
    "strands-agents>=1.0",
    "mcp>=1.2.0",
    "boto3>=1.34",
    # Servidor MCP de conhecimento (path dep no monorepo): torna `knowledge_mcp`
    # importável, então o agente sobe o servidor via `python -m knowledge_mcp.server`.
    "knowledge-mcp",
]

[tool.uv.sources]
knowledge-mcp = { path = "../mcp-servers/knowledge", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent"]
