[project]
name = "knowledge-mcp"
version = "0.1.0"
description = "Servidor MCP de conhecimento (tools do agente) — Fase 1"
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.2.0",
    # tzdata garante o banco de timezones IANA em qualquer plataforma
    # (Windows não o traz por padrão; a Lambda usa para os fusos).
    "tzdata>=2024.1",
    # boto3 para a tool search_knowledge_base (bedrock-agent-runtime.retrieve).
    # A Lambda já traz boto3; aqui é para dev/teste local.
    "boto3>=1.34",
]

[project.scripts]
# Entrypoint do servidor MCP (transporte stdio). O agente sobe este comando.
knowledge-mcp = "knowledge_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/knowledge_mcp"]
